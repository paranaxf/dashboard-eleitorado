name: Atualizar dados do TSE

# Baixa o arquivo oficial do TSE, gera o CSV resumido e salva no repositório.
# Roda quando o script muda ou manualmente (aba Actions > Run workflow).
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/preparar_dados.py
      - .github/workflows/dados_tse.yml

permissions:
  contents: write

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pandas
        run: pip install pandas

      - name: Baixar arquivo oficial do TSE
        run: |
          curl -fL --retry 3 --retry-delay 10 -o perfil_eleitorado_ATUAL.zip \
            https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitorado/perfil_eleitorado_ATUAL.zip
          ls -lh perfil_eleitorado_ATUAL.zip

      # O unzip do sistema entende mais formatos de compressão que o zipfile do Python
      - name: Extrair o zip
        run: |
          mkdir -p bruto
          unzip -o perfil_eleitorado_ATUAL.zip -d bruto 2>&1 | tee extracao.txt || 7z x -obruto -y perfil_eleitorado_ATUAL.zip
          ls -lh bruto

      - name: Gerar CSV resumido
        run: |
          mkdir -p dados
          set -o pipefail
          python scripts/preparar_dados.py "$(ls bruto/*.csv | head -1)" 2>&1 | tee dados/log_geracao.txt

      # Salva também o log, mesmo se der erro, para dar para conferir sem login no Actions
      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet || git commit -m "Atualiza dados do TSE"
          git push
